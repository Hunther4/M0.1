# openspec/config.yaml
schema: spec-driven

context: |
  Project: M0.1 — Educational autoregressive decoder-only transformer
  Tech stack: Python 3.12.10 / PyTorch 2.12.0+rocm7.14.0 (ROCm via AMD HIP, no HuggingFace Trainer)
  Hardware: AMD RX 9060 XT (gfx1200, 15.9GB VRAM), ROCm 7.14.0, HIP 7.14.60850
  Architecture: Modular Python package (src/transformer, src/model, src/training, src/engine_v2, src/eval, src/inference, src/tokenizer, src/data, src/tools)
  Testing: pytest 9.1.1, 321 tests (all passing)
  Style: PEP 8, no formatter/linter installed yet
  Performance: 162ms forward pass (batch=4, seq=1024, 80M params)
  Training: layer-stacking strategy; run_0001 (batch 20, 488 steps, 9.99M tokens) loss 5.58
    V2 engine (FSM, EventBus, LossPipeline) active via src/training/train.py
    V1 engine (callback-based) legacy, kept for script/* compatibility
  Tokenizer: fixed 16k BPE (data/tokenizers/tokenizer.json, SHA 6bc3a6…)
  Corpora: corpus1 (10M tokens, trained) / corpus2 (17M, next) / corpus3 (265M, future)
  Audit: full fixed (z-loss double-count, weights_only, inference, eval, corpus, KV cache)

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    tdd: true
    test_command: "pytest -v"
  verify:
    test_command: "pytest -v"
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
    - Sync openspec/config.yaml context block with current project state
